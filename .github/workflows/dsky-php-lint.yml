name: Moon PHP syntax checks
on:
  push:
    paths:
      - "dsky_*.php"
      - "delta_v_status.php"
      - "instruments/delta_v.php"
      - "instruments/dsky.php"
      - "execute.php"
      - "met_clock.php"
      - "met_status.php"
      - "instruments/met_clock.php"
      - "fido_console.php"
      - "tests/met_clock_test.php"
      - "navigation.php"
      - "fido_navigation.php"
      - "fido_ground.php"
      - "fido_page.php"
      - "fido_pages/summary.php"
      - "fido_pages/orbit.php"
      - "fido_pages/state.php"
      - "rtcc_solution.php"
      - "tests/fido_ground_source_test.php"
      - "fido_pages/navigation.php"
      - "fido_console.php"
      - "tests/fido_navigation_test.php"
      - "tests/navigation_test.php"
      - "physics.php"
      - "delta_v*.php"
      - "instruments/delta_v.php"
      - "rtcc_*.php"
      - "fido_projection.php"
      - "fido_plan_trace.php"
      - "fido_los.php"
      - "fido_pages/trajectory_map.php"
      - "fido_pages/proximity_map.php"
      - "fido_pages/flight_compare.php"
      - "fido_saved_solutions.sql"
      - "docking_sensor.php"
      - "docking_sensor_status.php"
      - "docking_sensor_schema.sql"
      - "instruments/docking_sensor.php"
      - "tests/docking_sensor_test.php"
      - "tests/fido_visualization_test.php"
      - "dsky_rendezvous_schema.sql"
      - "tests/dsky_rendezvous_test.php"
      - "star_*.php"
      - "instruments/sextant.php"
      - "instruments/window.php"
      - "tests/star_alignment_test.php"
      - "tests/rtcc_rendezvous_test.php"
      - "fido_pages/rendezvous.php"
      - ".github/workflows/dsky-php-lint.yml"
  workflow_dispatch:
jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          for file in dsky_runtime.php dsky_rcs.php dsky_api.php instruments/dsky.php delta_v.php delta_v_status.php instruments/delta_v.php rtcc_rendezvous.php rtcc_solution.php star_alignment.php star_catalog.php instruments/sextant.php instruments/window.php tests/star_alignment_test.php fido_pages/rendezvous.php tests/rtcc_rendezvous_test.php execute.php physics.php navigation.php tests/navigation_test.php fido_navigation.php fido_pages/navigation.php fido_console.php tests/fido_navigation_test.php fido_ground.php fido_page.php fido_pages/summary.php fido_pages/orbit.php fido_pages/state.php tests/fido_ground_source_test.php dsky_rendezvous.php dsky_rcs_translate.php rtcc_maneuver.php tests/dsky_rendezvous_test.php met_clock.php met_status.php instruments/met_clock.php tests/met_clock_test.php dsky_dv_safety.php fido_los.php fido_projection.php fido_plan_trace.php rtcc_save.php fido_pages/trajectory_map.php fido_pages/proximity_map.php fido_pages/flight_compare.php tests/fido_visualization_test.php docking_sensor.php docking_sensor_status.php instruments/docking_sensor.php tests/docking_sensor_test.php; do
            php -l "$file" || exit 1
          done
      - name: Rendezvous engine regression tests
        run: php tests/rtcc_rendezvous_test.php
      - name: Star alignment regression tests
        run: php tests/star_alignment_test.php
      - name: Navigation math regression tests
        run: php tests/navigation_test.php
      - name: Ground navigation math regression
        run: php tests/fido_navigation_test.php
      - name: FIDO estimated-state isolation tests
        run: php tests/fido_ground_source_test.php
      - name: DSKY scheduled rendezvous encoding and fuel tests
        run: php tests/dsky_rendezvous_test.php
      - name: Mission elapsed clock regression
        run: php tests/met_clock_test.php
      - name: FIDO orbit, occultation and saved flight comparison regression
        run: php tests/fido_visualization_test.php
      - name: Docking geometry and permanent collision failure regression
        run: php tests/docking_sensor_test.php
